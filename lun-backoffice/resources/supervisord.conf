[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes = 0



[program:php-fpm]
command=/usr/local/sbin/php-fpm
redirect_stderr=true
stdout_logfile=/var/log/php-fpm/php-fpm.out.log
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
redirect_stderr=true
stdout_logfile=/var/log/nginx/nginx.out.log
stdout_logfile_maxbytes=0
