version: "3.8"

services:
  backoffice:
    build:
      context: ./lunt-backoffice
    environment:
      DATABASE_URL: "mysql://root:${MARIADB_ADMIN_PASSWORD}@mariadb:3306/${MARIADB_DB}?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: "smtp://mailer:1025"
      MARIADB_PASS: ${MARIADB_ADMIN_PASSWORD}
      MARIADB_DB: ${MARIADB_DB}
      APP_PORT: "80"
    ports:
      - "80:80"
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ADMIN_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailer:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
