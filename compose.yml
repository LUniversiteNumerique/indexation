version: "3.8"

services:
  backoffice:
    # Début variante pour les environnements dev
    # image: sslv-nexus.coexya.eu/lunt-backoffice:${VERSION:-latest}
    # Début variante pour le développement local
    build:
      context: ./lunt-backoffice
    # Fin variantes
    ports:
      - "8000:80"
    depends_on:
      - mariadb
      - mailer
    # Début variante pour les environnements local
    volumes:
      - ./lunt-backoffice:/var/www/site
      #- ./lunt-backoffice/php.ini:/usr/local/etc/php/php.ini
    # Fin variantes

  wordpress:
    image: wordpress:5.8.3-php7.3-apache
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${WORDPRESS_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASS}
      WORDPRESS_DB_NAME: unt_wp
      WORDPRESS_TABLE_PREFIX: uoh_
    ports:
      - "80:80"
    depends_on:
      - mariadb
    # Début variante pour les environnements dev
    # Note : Les données sont à copier manuellement.
    # volumes:
    #  - /opt/lunt-wordpress:/var/www/html
    # Début variante pour le développement local
    volumes:
      - ./lunt-wordpress:/var/www/html
    # Fin variantes

  myadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    ports: ["8080:80"]
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailer:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  solr:
    image: solr:latest
    restart: on-failure
    environment:
      - SOLR_HOME=/var/solr/data
      - SOLR_LOG_LEVEL=INFO
    ports:
      - "8983:8983"
    # Début variante pour les environnements dev
    # Note : Les données sont à copier manuellement.
    # volumes:
    #  - solr_data:/var/solr
    #  - /opt/lunt-solr:/var/solr/data
    # Début variante pour le développement local
    volumes:
      - solr_data:/var/solr
      - ./lunt-solr:/var/solr/data
    # Fin variantes
    command:
      - solr-precreate
      - unt1

volumes:
  db_data:
  solr_data:
  wp_data:
