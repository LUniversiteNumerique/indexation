version: "3.8"

services:
  backoffice:
    # Variante pour les environnements dev et int
    # image: sslv-nexus.coexya.eu/lunt-backoffice:${VERSION:-latest}
    # Variante pour le développement local
    build:
      context: ./lunt-backoffice
    env_file:
      - ./lunt-backoffice/.env
    ports:
      - "80:80"
    depends_on:
      - mariadb
      - mailer
      - solr
    volumes:
      - ./lunt-backoffice:/var/www/site

  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  myadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    ports: ["8080:80"]
    depends_on:
      - mariadb

  mailer:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  solr:
    image: solr:latest
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
    command:
      - solr-precreate
      - notices

volumes:
  db_data:
  solr_data:
