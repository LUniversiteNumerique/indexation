services:
  backoffice:
    build: ./lunt-backoffice
    env_file: ./lunt-backoffice/.env.dev.local
    network_mode: "host"
    depends_on:
      - mariadb
      - solr
    volumes:
      - ./lunt-backoffice:/var/www/site
      - ${JOAI_BASE_URI:-/opt}:/opt
      - ${JOAI_BASE_URI}/lunt-resources/uploads:/var/www/site/public/uploads

  mariadb:
    image: mariadb:11.7.2
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    network_mode: "host"
    volumes:
      - db_data:/var/lib/mysql

  solr:
    image: solr:9.8-slim
    network_mode: "host"
    volumes:
      - ${JOAI_BASE_URI}/lunt-solr/data:/var/solr/data
      - ${JOAI_BASE_URI}/lunt-solr/conf:${SOLR_DEFAULT_CONF}/conf
    command:
      - solr-precreate
      - unt1
      - ${SOLR_DEFAULT_CONF}

  joai:
    build: ./lunt-joai
    network_mode: "host"
    volumes:
      - ./lunt-joai/conf:/joai/config
      - ./lunt-joai/conf/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ./lunt-joai/conf/Catalina/localhost/joai.xml:/usr/local/tomcat/conf/Catalina/localhost/joai.xml
      - ./lunt-joai/data/repository_settings_and_data:/joai/config/repository
      - ./lunt-resources/XML:/XML
volumes:
  db_data:
