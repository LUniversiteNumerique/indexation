version: "3.8"

services:
  backoffice:
    # Variante pour les environnements dev et int
    # image: sslv-nexus.coexya.eu/lunt-backoffice:${VERSION:-latest}
    # Variante pour le développement local
    build:
      context: ./lunt-backoffice
    env_file:
      - ./.env
    ports:
      - "8000:80"
    depends_on:
      - mariadb
      - mailer
    volumes:
      - ./lunt-backoffice:/var/www/site
      #- ./lunt-backoffice/php.ini:/usr/local/etc/php/php.ini

  wordpress:
    image: wordpress:5.2.0-php7.3-apache
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${WORDPRESS_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASS}
      WORDPRESS_DB_NAME: unt_wp
      WORDPRESS_TABLE_PREFIX: uoh_
    ports:
      - "80:80"
    depends_on:
      - mariadb
    volumes:
      - ./lunt-backoffice/data/wdps:/var/www/html

  myadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    ports: ["8080:80"]
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailer:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  solr:
    image: solr:latest
    restart: on-failure
    environment:
      - SOLR_HOME=/var/solr/data
      - SOLR_LOG_LEVEL=INFO
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
      - ./lunt-backoffice/data/solr:/var/solr/data
    command:
      - solr-precreate
      - unt1

volumes:
  db_data:
  solr_data:
  wp_data:
