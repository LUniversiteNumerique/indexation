services:
  backoffice:
    build: ./lunt-backoffice
    env_file: ./lunt-backoffice/.env.dev.local
    network_mode: "host"
    depends_on:
      - mariadb
      - solr
    volumes:
      - ./lunt-backoffice:/var/www/site
      - ${JOAI_BASE_URI:-/opt}:/opt

  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_DATABASE: ${MARIADB_DB}
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASS}
    network_mode: "host"
    volumes:
      - db_data:/var/lib/mysql

  solr:
    image: solr:latest
    network_mode: "host"
    volumes:
      - ${JOAI_BASE_URI}/lunt-solr/data:/var/solr/data
      - ${JOAI_BASE_URI}/lunt-solr/conf:${SOLR_DEFAULT_CONF}/conf
    command:
      - solr-precreate
      - unt1
      - ${SOLR_DEFAULT_CONF}

volumes:
  db_data:
